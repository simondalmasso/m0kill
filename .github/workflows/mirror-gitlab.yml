name: Mirror GitHub to GitLab

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-to-gitlab-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
      GITLAB_TARGET: gitlab.com/simondalmasso/Moneykiller.git
    steps:
      - name: Checkout canonical GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require GitLab write credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_MIRROR_TOKEN}" ]; then
            echo "::error::Missing repository secret GITLAB_MIRROR_TOKEN (GitLab token with write_repository scope)."
            exit 1
          fi

      - name: Fetch every GitHub branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Mirror into non-destructive GitLab namespace
        shell: bash
        run: |
          set -euo pipefail
          remote="https://oauth2:${GITLAB_MIRROR_TOKEN}@${GITLAB_TARGET}"

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "${branch}" = "HEAD" ] && continue
            echo "Mirroring branch ${branch} -> github/${branch}"
            git push "${remote}" "${ref}:refs/heads/github/${branch}"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            echo "Mirroring tag ${tag} -> github/${tag}"
            git push "${remote}" "${ref}:refs/tags/github/${tag}"
          done < <(git for-each-ref --format='%(refname)' refs/tags/)

      - name: Mirror policy
        run: |
          echo "Source: https://github.com/simondalmasso/m0kill"
          echo "Target: https://gitlab.com/simondalmasso/Moneykiller"
          echo "Branch mapping: refs/heads/X -> refs/heads/github/X"
          echo "Tag mapping: refs/tags/X -> refs/tags/github/X"
          echo "Historical GitLab refs are never deleted or overwritten."

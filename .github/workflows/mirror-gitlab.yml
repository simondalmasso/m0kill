name: Mirror GitHub to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-to-gitlab-mirror
  cancel-in-progress: true

env:
  GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
  GITLAB_TARGET: gitlab.com/simondalmasso/Moneykiller.git

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror activation status
        shell: bash
        run: |
          if [ -z "$GITLAB_MIRROR_TOKEN" ]; then
            echo "GitLab mirror is configured but inactive until GITLAB_MIRROR_TOKEN exists."
          else
            echo "GitLab mirror credential is configured."
          fi

      - name: Checkout canonical GitHub repository
        if: env.GITLAB_MIRROR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every GitHub branch and tag
        if: env.GITLAB_MIRROR_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Mirror into non-destructive GitLab namespace
        if: env.GITLAB_MIRROR_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          remote="https://oauth2:${GITLAB_MIRROR_TOKEN}@${GITLAB_TARGET}"

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "${branch}" = "HEAD" ] && continue
            echo "Mirroring branch ${branch} -> github/${branch}"
            git push "${remote}" "${ref}:refs/heads/github/${branch}"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            echo "Mirroring tag ${tag} -> github/${tag}"
            git push "${remote}" "${ref}:refs/tags/github/${tag}"
          done < <(git for-each-ref --format='%(refname)' refs/tags/)

      - name: Mirror policy
        run: |
          echo "Source: https://github.com/simondalmasso/m0kill"
          echo "Target: https://gitlab.com/simondalmasso/Moneykiller"
          echo "Mapping: GitHub branch X -> GitLab branch github/X"
          echo "Historical GitLab refs are never deleted or overwritten."
